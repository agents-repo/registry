# SonarQube Cloud automatic analysis (see https://docs.sonarsource.com/sonarqube-cloud).
sonar.sourceEncoding=UTF-8

# Directory names only for sonar.sources and sonar.tests: Automatic Analysis does
# not allow wildcard paths there. Do not set sonar.sources to `.` while
# sonar.tests lists nested directories — analysis fails with path overlap.
sonar.sources=scripts,specs,packages

# Binary, generated, and snapshot assets. `**/versions/**` excludes package-build
# snapshots under packages/**/versions/ so they are not analyzed next to source.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/versions/**,**/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.ico,**/*.webp,**/*.svg,**/*.woff,**/*.woff2,**/*.map

# Tooling tests (`test/`) and Vitest suites (`tests/`) are test code, not production sources.
sonar.tests=test,tests

sonar.cpd.exclusions=**/package-lock.json

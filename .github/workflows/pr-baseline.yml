name: PR Baseline Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node and pinned npm
        uses: ./.github/actions/setup-node-pinned-npm

      - name: Validate runtime
        run: npm run env:check

      - name: Run all lints
        run: npm run lint:all

      - name: Check IDE instruction mirrors
        run: npm run sync:ide-instructions -- --check

      - name: Setup Chrome for Marp PDF
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: setup-chrome

      - name: Check slide PDF drift
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROME_NO_SANDBOX: '1'
        run: npm run slides:check

      - name: Verify registry package installs from lock
        run: |
          rm -rf .github/agents .cursor/skills .claude/agents .agents/skills
          npm run agents:ci
          drift_paths=(
            agents.json
            agents-lock.json
            .github/agents
            .cursor/skills
            .claude/agents
            .agents/skills
          )
          git diff --exit-code -- "${drift_paths[@]}"
          test -z "$(git status --porcelain -- "${drift_paths[@]}")"

      - name: Run unit tests
        run: npm run test:run

      - name: Typecheck
        run: npm run typecheck

      - name: Scan package ZIPs
        run: npm run package:scan-zips

name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run semantic-release in dry-run mode"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Release Inputs
    if: github.repository == 'agents-repo/registry'
    runs-on: ubuntu-latest
    steps:
      - name: Bootstrap registry CI
        uses: ./.github/actions/registry-ci-bootstrap

      - name: Run markdown lint
        run: npm run lint:md

      - name: Run Sonar lint
        run: npm run lint:sonar

      - name: Run typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:run

      - name: Scan package ZIPs
        run: npm run package:scan-zips

  release-dry-run:
    name: Release Dry Run
    if: github.repository == 'agents-repo/registry' && github.event_name == 'workflow_dispatch' && inputs.dry_run == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - validate
    steps:
      - name: Bootstrap registry CI
        uses: ./.github/actions/registry-ci-bootstrap
        with:
          fetch-depth: '0'
          validate-runtime: 'false'

      - name: Run semantic-release (dry run)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:dry-run

  release-publish:
    name: Publish GitHub Release
    if: >-
      github.repository == 'agents-repo/registry' &&
      ((github.event_name == 'workflow_dispatch' && inputs.dry_run == false && github.ref == 'refs/heads/main') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        !startsWith(github.event.head_commit.message, 'feat(package):') &&
        !startsWith(github.event.head_commit.message, 'feat(package)!:') &&
        !startsWith(github.event.head_commit.message, 'fix(package):') &&
        !startsWith(github.event.head_commit.message, 'fix(package)!:')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    needs:
      - validate
    steps:
      - name: Bootstrap registry CI
        uses: ./.github/actions/registry-ci-bootstrap
        with:
          fetch-depth: '0'
          validate-runtime: 'false'

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

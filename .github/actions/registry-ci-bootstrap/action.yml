# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Registry CI bootstrap
description: Checkout, setup pinned Node/npm with dependencies, and optionally validate runtime.

inputs:
  fetch-depth:
    description: Checkout fetch depth (0 for full history).
    required: false
    default: '1'
  validate-runtime:
    description: Run npm run env:check after install.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Setup Node and pinned npm
      uses: ./.github/actions/setup-node-pinned-npm

    - name: Validate runtime
      if: inputs.validate-runtime == 'true'
      shell: bash
      run: npm run env:check
